<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papers - ICT Experts</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="logo-icon">ICT</div><div><div class="logo-text">ICT Experts</div><div class="logo-sub">Admin Panel</div></div></div>
      <nav class="sidebar-nav">
        <div class="nav-section"><div class="nav-section-title">Overview</div>
          <a href="/admin-dashboard.html" class="nav-link"><i class="bi bi-grid"></i> Dashboard</a>
          <a href="/students.html" class="nav-link"><i class="bi bi-people"></i> Students</a>
          <a href="/papers.html" class="nav-link active"><i class="bi bi-file-earmark-text"></i> Papers</a>
          <a href="/reports.html" class="nav-link"><i class="bi bi-bar-chart-line"></i> Reports</a>
        </div>
        <div class="nav-section"><div class="nav-section-title">Account</div><a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a></div>
      </nav>
      <div class="sidebar-footer"><div class="user-chip"><div class="user-avatar" id="userAvatar">AD</div><div><div class="user-name" id="userName">Loading...</div><div class="user-role" id="userRole">Admin</div></div></div></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left"><button class="menu-toggle" id="menuToggle"><i class="bi bi-list"></i></button><h1 class="page-title">Examination Papers</h1></div>
        <div class="topbar-actions"><button class="btn btn-primary" onclick="openPaperModal()"><i class="bi bi-plus-lg"></i> Add Paper</button></div>
      </header>
      <div class="content-area">
        <div class="card" style="margin-bottom:20px;">
          <div class="card-body" style="display:flex;gap:12px;flex-wrap:wrap;">
            <div style="flex:1;min-width:240px;position:relative;"><i class="bi bi-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-tertiary);"></i><input type="text" id="searchPapers" class="form-input" placeholder="Search papers..." style="padding-left:36px;" /></div>
            <select id="filterType" class="form-select" style="width:200px;"><option value="">All Types</option><option value="Past Paper">Past Paper</option><option value="Model Paper">Model Paper</option><option value="School Term Test">Term Test</option><option value="Monthly Test">Monthly Test</option><option value="Other">Other</option></select>
            <button class="btn btn-secondary" onclick="loadPapers()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
          </div>
        </div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Paper Name</th><th>Type</th><th>Category</th><th>Max Marks</th><th>Exam Date</th><th>Stats</th><th>Actions</th></tr></thead><tbody id="papersBody"><tr><td colspan="7" class="empty"><div class="spinner"></div></td></tr></tbody></table></div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="paperModal">
    <div class="modal">
      <div class="modal-header"><div class="modal-title" id="paperModalTitle">Add New Paper</div><button class="btn btn-sm btn-ghost" onclick="closeModal('paperModal')"><i class="bi bi-x-lg"></i></button></div>
      <div class="modal-body">
        <form id="paperForm">
          <div class="form-group"><label class="form-label">Paper Name *</label><input type="text" id="paperName" class="form-input" placeholder="e.g., ICT Model Paper 01" required /></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Paper Type *</label><select id="paperType" class="form-select" required><option value="Model Paper">Model Paper</option><option value="Past Paper">Past Paper</option><option value="School Term Test">School Term Test</option><option value="Monthly Test">Monthly Test</option><option value="Other">Other</option></select></div>
            <div class="form-group"><label class="form-label">Category</label><input type="text" id="paperCategory" class="form-input" placeholder="ICT" value="ICT" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Maximum Marks *</label><input type="number" id="maxMarks" class="form-input" placeholder="100" min="1" max="1000" required /></div>
            <div class="form-group"><label class="form-label">Exam Date *</label><input type="date" id="examDate" class="form-input" required /></div>
          </div>
          <div class="form-group"><label class="form-label">Description (optional)</label><textarea id="paperDescription" class="form-textarea" placeholder="Paper details, syllabus coverage..."></textarea></div>
        </form>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('paperModal')">Cancel</button><button class="btn btn-primary" id="savePaperBtn" onclick="document.getElementById('paperForm').requestSubmit()">Save Paper</button></div>
    </div>
  </div>

  <div id="toastContainer" style="position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;"></div>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/papers.js"></script>
</body>
</html>
